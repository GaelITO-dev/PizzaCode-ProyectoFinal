# Sitio de Pizza Code en Nginx.
# En el VPS va en: /etc/nginx/sites-available/pizzacode (activado con un enlace en sites-enabled)
# HTTPS con Let's Encrypt (Certbot, #38). El certificado se renueva solo con certbot.timer.

# HTTPS: frontend + API
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name pizzacode.tech www.pizzacode.tech;

    ssl_certificate /etc/letsencrypt/live/pizzacode.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pizzacode.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Build de React (npm run build)
    root /var/www/pizzacode;
    index index.html;

    # Llamadas a la API -> backend (servicio pizzacode, solo accesible dentro del VPS)
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rutas de React (/cliente/carrito, etc.): si el archivo no existe, se entrega index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTP: todo se redirige a HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name pizzacode.tech www.pizzacode.tech;
    return 301 https://$host$request_uri;
}
