# Sitio de Pizza Code en Nginx.
# En el VPS va en: /etc/nginx/sites-available/pizzacode (activado con un enlace en sites-enabled)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;   # cambiar por el dominio cuando exista (luego Certbot agrega HTTPS, #38)

    # Build de React (npm run build)
    root /var/www/pizzacode;
    index index.html;

    # Llamadas a la API -> backend (servicio pizzacode, solo accesible dentro del VPS)
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rutas de React (/cliente/carrito, etc.): si el archivo no existe, se entrega index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}